spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: true

#MODE=PostgreSQL: để H2 giả lập syntax gần PostgreSQL hơn
#DB_CLOSE_DELAY=-1: DB không bị đóng sau mỗi connection
#create-drop: tạo schema khi test chạy, xóa khi xong